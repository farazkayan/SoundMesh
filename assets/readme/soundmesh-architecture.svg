<rect x="340" y="206" width="93" height="36" rx="10" fill="#173a3b" stroke="#4eaa98"/>
<text x="386.5" y="221" fill="#b2f7e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">TYPED</text><text x="386.5" y="234" fill="#b2f7e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">BRIDGE</text>
