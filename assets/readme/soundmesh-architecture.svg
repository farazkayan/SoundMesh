 <rect x="474" y="201" width="196" height="142" rx="12" fill="#102127" stroke="#315c5b"/><text x="492" y="230" fill="#a5f5de" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Audio path</text><text x="492" y="260" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Capture / encode</text><text x="492" y="284" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Receive / buffer</text><text x="492" y="308" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">AudioTrack output</text>
 <rect x="694" y="201" width="196" height="142" rx="12" fill="#102127" stroke="#315c5b"/><text x="712" y="230" fill="#a5f5de" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Timing engine</text><text x="712" y="260" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Clock estimation</text><text x="712" y="284" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Shared timeline</text><text x="712" y="308" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Scheduled playback</text>
 <rect x="914" y="201" width="212" height="142" rx="12" fill="#102127" stroke="#315c5b"/><text x="932" y="230" fill="#a5f5de" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Connection layer</text><text x="932" y="260" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Local discovery</text><text x="932" y="284" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Room transport</text><text x="932" y="308" fill="#d2e5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Session lifecycle</text>
</g>
