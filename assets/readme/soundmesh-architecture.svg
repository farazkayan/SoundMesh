<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">SoundMesh architecture</title><desc id="desc">Flutter handles UI and orchestration, connected over a typed platform bridge to native Android audio, timing and networking. Phones coordinate over a local network and render audio through their own speakers.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b141a"/><stop offset="1" stop-color="#10262c"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#46dcb6"/><stop offset="1" stop-color="#83f4d6"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#66e9c8"/></marker>
</defs>
<rect width="1200" height="690" rx="24" fill="url(#bg)"/>
<g opacity=".12" stroke="#83bdb4" stroke-width="1"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200M0 630H1200"/><path d="M70 0V690M140 0V690M210 0V690M280 0V690M350 0V690M420 0V690M490 0V690M560 0V690M630 0V690M700 0V690M770 0V690M840 0V690M910 0V690M980 0V690M1050 0V690M1120 0V690"/></g>
<text x="52" y="56" fill="#eefaf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Inside SoundMesh</text>
<text x="52" y="83" fill="#9bbab8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">One simple experience, split across app logic and Android's time-critical runtime.</text>
<!-- Flutter card -->
<g filter="url(#shadow)"><rect x="48" y="125" width="280" height="250" rx="18" fill="#14252c" stroke="#437c78" stroke-width="1.5"/></g>
<rect x="48" y="125" width="280" height="54" rx="18" fill="#1d3b3c"/><path d="M48 160H328V179H48Z" fill="#1d3b3c"/>
<text x="74" y="160" fill="#a5f5de" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">FLUTTER / DART</text>
<text x="74" y="210" fill="#effaf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">App experience</text>
<g fill="#b8d1ce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15"><text x="76" y="244">• Screens and navigation</text><text x="76" y="274">• Room and participant state</text><text x="76" y="304">• User actions and orchestration</text><text x="76" y="334">• High-level session flow</text></g>
