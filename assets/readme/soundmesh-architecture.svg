 <rect x="112" y="544" width="204" height="93" rx="14" fill="#14252c" stroke="#467d77"/><text x="214" y="572" fill="#edfaf6" font-size="16" font-weight="700">Host phone</text><text x="214" y="596" fill="#abcac5" font-size="13">Capture + coordinate</text><text x="214" y="616" fill="#74e7c7" font-size="13">Own speaker output</text>
