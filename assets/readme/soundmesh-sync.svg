<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="465" viewBox="0 0 1200 465" role="img" aria-labelledby="title desc">
<title id="title">SoundMesh shared playback timeline</title><desc id="desc">The host and participants prepare audio, estimate timing relationships, choose a future target and schedule output locally against a shared logical timeline.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b141a"/><stop offset="1" stop-color="#12312f"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4cdab6"/><stop offset="1" stop-color="#a1ffe5"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#66e9c8"/></marker></defs>
<rect width="1200" height="465" rx="24" fill="url(#b)"/><g opacity=".1" stroke="#9ac6bf"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200"/><path d="M80 0V465M160 0V465M240 0V465M320 0V465M400 0V465M480 0V465M560 0V465M640 0V465M720 0V465M800 0V465M880 0V465M960 0V465M1040 0V465M1120 0V465"/></g>
<text x="48" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#eefaf6">Schedule, don't shout.</text><text x="48" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#9bbab8">Playback is planned against a shared timeline—not triggered by packet arrival.</text>
<rect x="48" y="117" width="240" height="78" rx="14" fill="#14282c" stroke="#46877d"/><text x="168" y="146" fill="#a5f5de" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">1. CALIBRATE</text><text x="168" y="171" fill="#c2d9d4" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Estimate offset + uncertainty</text>
<path d="M290 156H340" stroke="#66e9c8" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="346" y="117" width="240" height="78" rx="14" fill="#14282c" stroke="#46877d"/><text x="466" y="146" fill="#a5f5de" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">2. PREPARE</text><text x="466" y="171" fill="#c2d9d4" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Distribute + buffer audio</text>
<path d="M588 156H638" stroke="#66e9c8" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="644" y="117" width="240" height="78" rx="14" fill="#163d3a" stroke="#61d9b8"/><text x="764" y="146" fill="#b5f7e4" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">3. CHOOSE TARGET</text><text x="764" y="171" fill="#c2e9e1" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">A safe future play time</text>
<path d="M886 156H936" stroke="#66e9c8" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="942" y="117" width="210" height="78" rx="14" fill="#14282c" stroke="#46877d"/><text x="1047" y="146" fill="#a5f5de" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">4. SCHEDULE</text><text x="1047" y="171" fill="#c2d9d4" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Each phone plays locally</text>
<text x="48" y="245" fill="#a7d8cd" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">SHARED LOGICAL TIMELINE</text><path d="M58 279H1143" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
<g fill="#8df4d8" stroke="#173c37" stroke-width="4"><circle cx="250" cy="279" r="9"/><circle cx="520" cy="279" r="9"/><circle cx="790" cy="279" r="9"/><circle cx="1060" cy="279" r="9"/></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="250" y="307" fill="#c3d8d4" font-size="13">Audio ready</text><text x="520" y="307" fill="#c3d8d4" font-size="13">Timing refined</text><text x="790" y="307" fill="#b6f4e2" font-size="13" font-weight="700">Future target</text><text x="1060" y="307" fill="#c3d8d4" font-size="13">Local playback</text></g>
<path d="M790 324V349M210 349H990M210 349V368M600 349V368M990 349V368" fill="none" stroke="#66e9c8" stroke-width="2"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="100" y="369" width="220" height="53" rx="12" fill="#102127" stroke="#3f796f"/><text x="210" y="391" fill="#e4f7f1" font-size="15" font-weight="700">Host device</text><text x="210" y="409" fill="#8debd0" font-size="12">Local scheduled output</text><rect x="490" y="369" width="220" height="53" rx="12" fill="#102127" stroke="#3f796f"/><text x="600" y="391" fill="#e4f7f1" font-size="15" font-weight="700">Participant A</text><text x="600" y="409" fill="#8debd0" font-size="12">Local scheduled output</text><rect x="880" y="369" width="220" height="53" rx="12" fill="#102127" stroke="#3f796f"/><text x="990" y="391" fill="#e4f7f1" font-size="15" font-weight="700">Participant B</text><text x="990" y="409" fill="#8debd0" font-size="12">Local scheduled output</text></g>
<text x="600" y="449" text-anchor="middle" fill="#83aca7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">The timeline is a design model; actual alignment depends on device audio paths and network conditions.</text>
</svg>