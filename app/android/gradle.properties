org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Re-enable Kotlin incremental compilation for faster debug builds
kotlin.incremental=true
# Disable R8 for debug builds
android.debug.ignoreTestAssets=true
# Skip unnecessary tasks for debug
android.skipValidation=true
